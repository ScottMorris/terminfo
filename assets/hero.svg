<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">terminfo</title>
  <desc id="hero-desc">Inspect the terminal you are running in. A tabbed Ratatui TUI showing colour depth, attributes, Unicode rendering, live mouse and keyboard input, and the detected graphics protocol.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f13"/>
      <stop offset="100%" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ecddc"/>
      <stop offset="55%" stop-color="#9bb4d8"/>
      <stop offset="100%" stop-color="#e29be0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="termClip">
      <rect x="60" y="42" width="500" height="216" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- ambient glow, very soft -->
  <g opacity="0.06">
    <circle cx="220" cy="240" r="150" fill="#6ecddc"/>
    <circle cx="980" cy="60" r="160" fill="#e29be0"/>
    <circle cx="620" cy="150" r="140" fill="#9bb4d8"/>
  </g>

  <!-- terminal window mock-up: a miniature terminfo, running inside terminfo's own hero -->
  <g clip-path="url(#termClip)">
    <rect x="60" y="42" width="500" height="216" fill="#14161a"/>
    <rect x="60" y="42" width="500" height="26" fill="#1b1e24"/>

    <!-- seven-block colour grid, standing in for the Graphics tab's procedural artwork -->
    <g>
      <!-- row 1 -->
      <rect x="76" y="80" width="36" height="22" fill="#6ecddc"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="116" y="80" width="36" height="22" fill="#d67ad2"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.6s" begin="0.15s" repeatCount="indefinite"/></rect>
      <rect x="156" y="80" width="36" height="22" fill="#f0c864"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.2s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="196" y="80" width="36" height="22" fill="#98d279"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" begin="0.45s" repeatCount="indefinite"/></rect>
      <rect x="236" y="80" width="36" height="22" fill="#7aa2d6"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.9s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="276" y="80" width="36" height="22" fill="#9bb4d8"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" begin="0.75s" repeatCount="indefinite"/></rect>
      <!-- row 2 -->
      <rect x="76" y="106" width="36" height="22" fill="#e29be0"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.1s" begin="0.2s" repeatCount="indefinite"/></rect>
      <rect x="116" y="106" width="36" height="22" fill="#98d279"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" begin="0.35s" repeatCount="indefinite"/></rect>
      <rect x="156" y="106" width="36" height="22" fill="#6ecddc"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" begin="0.5s" repeatCount="indefinite"/></rect>
      <rect x="196" y="106" width="36" height="22" fill="#f0c864"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.4s" begin="0.65s" repeatCount="indefinite"/></rect>
      <rect x="236" y="106" width="36" height="22" fill="#9bb4d8"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></rect>
      <rect x="276" y="106" width="36" height="22" fill="#d67ad2"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.7s" begin="0.95s" repeatCount="indefinite"/></rect>
      <!-- row 3 -->
      <rect x="76" y="132" width="36" height="22" fill="#f0c864"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" begin="0.1s" repeatCount="indefinite"/></rect>
      <rect x="116" y="132" width="36" height="22" fill="#7aa2d6"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.3s" begin="0.25s" repeatCount="indefinite"/></rect>
      <rect x="156" y="132" width="36" height="22" fill="#98d279"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="196" y="132" width="36" height="22" fill="#e29be0"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.9s" begin="0.55s" repeatCount="indefinite"/></rect>
      <rect x="236" y="132" width="36" height="22" fill="#6ecddc"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.6s" begin="0.7s" repeatCount="indefinite"/></rect>
      <rect x="276" y="132" width="36" height="22" fill="#f0c864"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.6s" begin="0.85s" repeatCount="indefinite"/></rect>
    </g>

    <!-- capability read-out, standing in for the Overview tab -->
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" xml:space="preserve">
      <text x="332" y="90"><tspan fill="#7e8796">TERM      </tspan><tspan fill="#c2cad6">xterm-256color</tspan></text>
      <text x="332" y="108"><tspan fill="#7e8796">COLORTERM </tspan><tspan fill="#98d279">truecolor</tspan></text>
      <text x="332" y="126"><tspan fill="#7e8796">PROTOCOL  </tspan><tspan fill="#e29be0">kitty</tspan></text>
      <text x="332" y="144"><tspan fill="#7e8796">MOUSE     </tspan><tspan fill="#98d279">enabled</tspan></text>
      <text x="332" y="162"><tspan fill="#7e8796">TABS      </tspan><tspan fill="#6ecddc">7</tspan></text>
    </g>

    <!-- mini tab bar: seven pills in terminfo's own accent order, a highlight chasing across them -->
    <g>
      <rect x="76"  y="222" width="60" height="20" rx="4" fill="#6ecddc" opacity="0.35"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="7s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="142" y="222" width="60" height="20" rx="4" fill="#d67ad2" opacity="0.35"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="7s" begin="1s" repeatCount="indefinite"/></rect>
      <rect x="208" y="222" width="60" height="20" rx="4" fill="#f0c864" opacity="0.35"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="7s" begin="2s" repeatCount="indefinite"/></rect>
      <rect x="274" y="222" width="60" height="20" rx="4" fill="#98d279" opacity="0.35"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="7s" begin="3s" repeatCount="indefinite"/></rect>
      <rect x="340" y="222" width="60" height="20" rx="4" fill="#7aa2d6" opacity="0.35"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="7s" begin="4s" repeatCount="indefinite"/></rect>
      <rect x="406" y="222" width="60" height="20" rx="4" fill="#9bb4d8" opacity="0.35"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="7s" begin="5s" repeatCount="indefinite"/></rect>
      <rect x="472" y="222" width="60" height="20" rx="4" fill="#e29be0" opacity="0.35"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="7s" begin="6s" repeatCount="indefinite"/></rect>
    </g>

    <!-- traffic-light dots, drawn last so they sit above the title-bar fill -->
    <circle cx="76" cy="55" r="4" fill="#e25d75"/>
    <circle cx="90" cy="55" r="4" fill="#f0c864"/>
    <circle cx="104" cy="55" r="4" fill="#98d279"/>
    <text x="310" y="59" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7e8796" text-anchor="middle">terminfo</text>
  </g>
  <rect x="60" y="42" width="500" height="216" rx="10" fill="none" stroke="#2e3540" stroke-width="1.2"/>

  <!-- title block -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace">
    <text x="628" y="120" font-size="56" font-weight="700" letter-spacing="1" fill="url(#brand)" filter="url(#text-glow)">terminfo</text>
    <text x="630" y="152" font-size="17" fill="#c2cad6">Inspect the terminal you are running in.</text>
    <text x="630" y="176" font-size="13" fill="#7e8796">colour &#183; attributes &#183; unicode &#183; mouse &#183; graphics protocol</text>

    <g transform="translate(628,198)">
      <rect width="440" height="36" rx="11" fill="#1b1e24" stroke="#2e3540" stroke-width="1"/>
      <circle cx="20" cy="18" r="4" fill="#6ecddc">
        <animate attributeName="fill" values="#6ecddc;#d67ad2;#f0c864;#98d279;#7aa2d6;#9bb4d8;#e29be0;#6ecddc" dur="8s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="23" font-size="12.5"><tspan fill="#9aa3b2">terminfo &#183;&#160;</tspan><tspan fill="#c2cad6">7 tabs</tspan><tspan fill="#7e8796">&#160;&#183; kitty &#183; iterm2 &#183; sixel &#183; halfblocks</tspan></text>
    </g>

    <text x="630" y="274" font-size="12" fill="#7e8796"><tspan fill="#9aa3b2">ratatui</tspan><tspan fill="#2e3540">&#160;|&#160;</tspan><tspan fill="#9aa3b2">rust</tspan><tspan fill="#2e3540">&#160;|&#160;</tspan><tspan fill="#9aa3b2">zero network</tspan><tspan fill="#2e3540">&#160;&#160;&#8226;&#160;&#160;</tspan><tspan fill="#9bb4d8">Liminal HQ</tspan></text>
  </g>
</svg>
